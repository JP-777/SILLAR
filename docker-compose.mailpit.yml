# Mailpit es infraestructura EXCLUSIVA de desarrollo y pruebas.
# Este archivo no se carga con `docker compose` normal y no forma parte
# del despliegue de producción.
services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: ${COMPOSE_PROJECT_NAME:-sillar}_mailpit
    restart: unless-stopped
    environment:
      # SILLAR autentica contra SMTP. El capturador acepta cualquier par
      # únicamente en este entorno efímero: no se versiona una credencial.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-56200}:8025"
