services:
  db:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME:-sillar}_db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "default_text_search_config=pg_catalog.spanish"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-sillar_dev}
      # Colación ICU: ordena ñ y tildes correctamente sin depender
      # de locales del sistema operativo. Se fija al crear el clúster.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-PE --encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sillar_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API de SILLAR.
  # Se levanta con:  docker compose --profile full up -d
  #
  # En desarrollo lo normal es 'dotnet run' desde backend/, así que este
  # servicio queda fuera del arranque por defecto. Sirve para probar el sistema
  # como se despliega de verdad.
  api:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-sillar}_api
    profiles: ["full"]
    # NO NEGOCIABLE. Activar o desactivar un módulo detiene el proceso a
    # propósito, porque el enrutamiento se construye al arrancar. Sin esta
    # política, activar un módulo apaga el sistema y no lo vuelve a encender.
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Desde otro contenedor la base se llama 'db', no 'localhost'.
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-sillar_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      # El host se detiene tras un cambio de activación y Docker lo relanza.
      Modules__RestartAfterActivation: "true"
      Media__RootPath: /data/media
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      # Carpeta del host, no volumen con nombre, para que respaldarla sea copiar
      # una carpeta que se ve desde el explorador de archivos.
      #
      # HAY QUE RESPALDARLA JUNTO CON LA BASE DE DATOS. Es la consecuencia
      # negativa que anota el ADR-011 y el error clásico: se vuelca la base, se
      # olvida esto, y al restaurar aparece un catálogo entero sin imágenes.
      - ${MEDIA_PATH:-./media}:/data/media
    depends_on:
      db:
        condition: service_healthy

  # Interfaz web para inspeccionar la base de datos.
  # Opcional: se levanta solo con  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME:-sillar}_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?define PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  pgadmin_data:
